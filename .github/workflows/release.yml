name: Darkys Launcher - Cross-platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            command: build:win
            artifact-path: release-single/*.exe
          - platform: linux-x64
            runner: ubuntu-latest
            command: build:linux
            artifact-path: release-single/*.deb

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify package version matches release tag
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "Package version: ${PACKAGE_VERSION}"
          echo "Release tag:     ${TAG_VERSION}"

          if [ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::package.json version (${PACKAGE_VERSION}) does not match tag (${TAG_VERSION})."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run ${{ matrix.command }}

      - name: Verify build outputs
        shell: bash
        run: |
          if [ ! -d "release-single" ]; then
            echo "::error::The release-single directory was not created. Check the electron-builder output directory."
            exit 1
          fi

          if ! find release-single -type f -print -quit | grep -q .; then
            echo "::error::No files were generated in release-single."
            exit 1
          fi

          echo "Files generated for ${{ matrix.platform }}:"
          find release-single -maxdepth 3 -type f -print

      - name: Upload distributable installer package
        uses: actions/upload-artifact@v7
        with:
          name: darkys-${{ matrix.platform }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download all platform builds
        uses: actions/download-artifact@v8
        with:
          pattern: darkys-*
          path: release-files/packages

      - name: Check source archive for secrets and generated folders
        shell: bash
        run: |
          SENSITIVE_FILES="$(git ls-files | grep -E '(^|/)\.env$|(^|/)(id_rsa|id_ed25519)$|\.(pem|p12|pfx)$' || true)"
          if [ -n "${SENSITIVE_FILES}" ]; then
            echo "::error::Potential secret files are tracked by Git. Remove them before publishing:"
            printf '%s\n' "${SENSITIVE_FILES}"
            exit 1
          fi

          GENERATED_FOLDERS="$(git ls-files | grep -E '(^|/)(node_modules|release-single)/' || true)"
          if [ -n "${GENERATED_FOLDERS}" ]; then
            echo "::error::Generated folders are tracked by Git. Remove them from the repository and add them to .gitignore:"
            printf '%s\n' "${GENERATED_FOLDERS}"
            exit 1
          fi

      - name: Create complete source archive
        shell: bash
        run: |
          mkdir -p release-files
          git archive \
            --format=zip \
            --prefix="Darkys-Launcher-${GITHUB_REF_NAME}/" \
            --output="release-files/Darkys-Launcher-${GITHUB_REF_NAME}-Source.zip" \
            HEAD

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-files
          find . -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish release and attach every file
        uses: softprops/action-gh-release@v3
        with:
          name: Darkys Launcher ${{ github.ref_name }}
          body_path: .github/release-notes-v1.5.1.md
          files: |
            release-files/packages/**/*.exe
            release-files/packages/**/*.deb
            release-files/Darkys-Launcher-${{ github.ref_name }}-Source.zip
            release-files/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: false
