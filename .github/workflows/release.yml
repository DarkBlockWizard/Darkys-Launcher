name: Darkys cross-platform release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            command: build:win
            artifact-path: release-single/Darkys.exe

          - platform: linux-x64
            runner: ubuntu-latest
            command: build:linux
            artifact-path: release-single/*.deb

          - platform: macos-universal
            runner: macos-latest
            command: build:mac
            artifact-path: |
              release-single/*.dmg
              release-single/*.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create macOS app icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p src/assets/Darkys.iconset
          for size in 16 32 64 128 256 512; do
            sips -z "$size" "$size" src/assets/logo.png --out "src/assets/Darkys.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" src/assets/logo.png --out "src/assets/Darkys.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns src/assets/Darkys.iconset -o src/assets/logo.icns

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build release package
        run: npm run ${{ matrix.command }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkys-${{ matrix.platform }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: darkys-*
          path: release-files
          merge-multiple: true

      - name: Attach files to release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: release-files/*
          generate_release_notes: true